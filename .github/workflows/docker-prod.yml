name: Build & publish production images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Extra tag to publish (in addition to the sha tag)
        required: false
        default: latest

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            build_args: ''
          - name: signaling
            dockerfile: apps/signaling/Dockerfile
            build_args: ''
          - name: migrate
            dockerfile: packages/db/Dockerfile
            build_args: ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # mediasoup prebuilt workers exist for arm64 too, but emulated builds
          # are slow — add linux/arm64 only if you deploy on arm.
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Optional: pull & restart on a single Docker host over SSH.
  # Requires the `production` environment plus SSH_HOST / SSH_USER / SSH_KEY secrets.
  deploy:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_REF_NAME
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH }}
            git fetch --tags --prune origin
            git checkout -f "tags/${GITHUB_REF_NAME}"
            export IMAGE_TAG="${GITHUB_REF_NAME#v}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # --env-file resolves the ${VAR} references in the compose file; the
            # shell IMAGE_TAG above still wins, as shell env outranks the file.
            docker compose --env-file .env.production -f infra/docker-compose.prod.yml pull
            docker compose --env-file .env.production -f infra/docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

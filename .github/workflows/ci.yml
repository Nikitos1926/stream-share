name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # libs first: apps import @stream-share/{db,shared} from dist/
      - name: Build workspace libraries
        run: |
          pnpm --filter @stream-share/db build
          pnpm --filter @stream-share/shared build

      - run: pnpm -r run lint

      - run: pnpm --filter @stream-share/signaling typecheck

      # next build type-checks the web app as part of the build
      - name: Build web
        run: pnpm --filter @stream-share/web build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          NEXT_PUBLIC_SIGNALING_URL: http://localhost:4000
          NEXT_PUBLIC_SIGNALING_WS_URL: ws://localhost:4000

      - run: pnpm --filter @stream-share/signaling build

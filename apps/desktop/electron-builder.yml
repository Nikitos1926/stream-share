# electron-builder configuration. Docs: https://www.electron.build/configuration
# Icons live in `resources/` (electron-builder derives the platform-specific
# formats from `resources/icon.png`). Output goes to `dist/`.

appId: streamshare.desktop
productName: Stream Share
copyright: Copyright © 2026 Stream Share

directories:
  buildResources: resources
  output: dist

# Only ship the compiled bundles; `out/main/assets` is populated by the
# electron-vite copy plugin, so `assets/` and `src/` are not needed at runtime.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # @electron/rebuild copies every binary it builds into bin/<platform>-<arch>-<abi>/
  # as a cache; the module itself only loads build/Release/*.node. Shipping the
  # cache breaks the macOS universal build: the postinstall rebuild on an arm64
  # runner leaves an arm64 binary that ends up byte-identical in both the x64
  # and arm64 halves, which @electron/universal rejects.
  - '!node_modules/electron-native-screenshare/bin{,/**/*}'

# The native screen-share module is rebuilt by electron-builder; its .node
# binaries are unpacked from the asar automatically.
npmRebuild: true

# In-app updates (electron-updater). The presence of this block makes
# electron-builder emit latest.yml / latest-linux.yml and *.blockmap next to the
# installers; the release workflow attaches them to the GitHub Release and the
# app polls `releases/latest/download/` for them. The generic provider is used
# instead of `github` because our tags are prefixed `desktop-v`, which the
# GitHub provider cannot map to a version. `--publish never` in CI keeps
# electron-builder from uploading anything itself.
#
# Artifact names must not contain spaces: GitHub replaces them with dots when
# an asset is uploaded, so the file names in latest.yml would no longer match.
#
# macOS is intentionally left out. electron-updater refuses to install unsigned
# apps on macOS and we do not have an Apple Developer ID, so Mac users keep
# downloading the DMG by hand (see src/main/updater.ts).
publish:
  provider: generic
  url: https://github.com/Nikitos1926/stream-share/releases/latest/download/

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: StreamShare-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}

mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - universal
  artifactName: StreamShare-${version}-${arch}.${ext}

linux:
  category: AudioVideo
  target:
    - AppImage
  artifactName: StreamShare-${version}-${arch}.${ext}

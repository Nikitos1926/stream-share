name: stream-share

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${REGISTRY}/migrate:${IMAGE_TAG:-latest}
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  signaling:
    image: ${REGISTRY}/signaling:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose: ['4000']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_NUM_WORKERS: ${MEDIASOUP_NUM_WORKERS:-2}
      # fixed infrastructure values — must match the published range below
      MEDIASOUP_RTC_MIN_PORT: 10000
      MEDIASOUP_RTC_MAX_PORT: 10100
    volumes:
      - thumbnails:/data/thumbnails
    ports:
      - '40000-40100:40000-40100/udp'
      - '40000-40100:40000-40100/tcp'
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${REGISTRY}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose: ['3000']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: 'https://${PUBLIC_HOST}'
      AUTH_TRUST_HOST: 'true'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # server-side calls go straight over the compose network
      SIGNALING_INTERNAL_URL: http://signaling:4000
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '80:80'
      - '443:443'
    depends_on: [web, signaling]

volumes:
  postgres_data:
  thumbnails:
  caddy_data:
  caddy_config:

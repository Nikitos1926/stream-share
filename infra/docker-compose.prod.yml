name: stream-share

env:
  ACME_EMAIL: nikita.kabakov.mail@gmail.com
  IMAGE_TAG: latest
  PUBLIC_HOST: streamshare.space
  REGISTRY: ghcr.io/nikitos1926/stream-share

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env:
      env_file: ../.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${REGISTRY}/migrate:${IMAGE_TAG:-latest}
    restart: 'no'
    env:
      env_file: ../.env.production
    depends_on:
      postgres:
        condition: service_healthy

  signaling:
    image: ${REGISTRY}/signaling:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose: ['4000']
    volumes:
      - ../.env.production:/app/.env.production
      - ../apps/signaling/.env.production:/app/apps/signaling/.env.production
      - thumbnails:/data/thumbnails
    ports:
      - '10000-10100:10000-10100/udp'
      - '10000-10100:10000-10100/tcp'
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${REGISTRY}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose: ['3000']
    volumes:
      - ../.env.production:/app/.env.production
      - ../apps/web/.env.production:/app/apps/web/.env.production
    environment:
      AUTH_URL: 'https://${PUBLIC_HOST}'
      AUTH_TRUST_HOST: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile', '--watch']
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '80:80'
      - '443:443'
    depends_on: [web, signaling]

volumes:
  postgres_data:
  thumbnails:
  caddy_data:
  caddy_config:
